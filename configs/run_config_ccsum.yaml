# configs/run_config_ccsum.yaml
# ============================================================
# Pipeline configuration for the CCSum summary-only test baseline.
#
# Dataset:
#   Hugging Face: ccsum/ccsum_summary_only
#   Split:        test
#   Rows:         300
#
# Note:
#   The summary-only release does not contain article bodies. The master table
#   stores metadata in document/document_norm for schema compatibility. Use this
#   dataset primarily for prefix/reference checks; SProb is metadata-based here,
#   not full article summarization.
# ============================================================

project:
  dataset_name: "ccsum_summary_only"
  dataset_version: "ccsum/ccsum_summary_only/test"
  frozen_master_table_path: "master_table_ccsum_n300_seed42_v3_dcq4_frozen.parquet"
  n_items_expected: 300
  global_seed: 42
  experiment_label: "ccsum_summary_only_n300"

outputs:
  runs_dir: "runs_ccsum"
  logs_dir: "logs_ccsum"

paths:
  runs_dir: "runs_ccsum"
  outputs_dir: "outputs_ccsum"
  logs_dir: "logs_ccsum"
  proxy_corpus_dir: "proxy_corpus_ccsum"

models:
  - model_id: "gpt4omini"
    provider: "openai"
    model_name: "gpt-4o-mini"
    env:
      api_key_var: "OPENAI_API_KEY"
    api:
      mode: "chat_completions"

  - model_id: "gemini25flash"
    provider: "gemini"
    model_name: "gemini-2.5-flash"
    env:
      api_key_var: "GEMINI_API_KEY"
    api:
      mode: "gemini"

  - model_id: "llama31_8b"
    provider: "openrouter"
    model_name: "meta-llama/llama-3.1-8b-instruct"
    env:
      api_key_var: "OPENROUTER_API_KEY"
    api:
      mode: "chat_completions"
      base_url: "https://openrouter.ai/api/v1"

prompts:
  dcq_prompt_path: "src/prompts.py::DCQ_PROMPT_TEMPLATE"
  mem_prompt_path: "src/prompts.py::MEM_PROMPT_TEMPLATE"
  stability_prompt_path: "src/prompts.py::STABILITY_PROMPT_TEMPLATE"

dcq:
  description: "Semantic detector via Discriminative Choice Question (A/B/C/D/E)."
  k_paraphrases: 4
  option_shuffle_seed: 1337
  output_constraint: "letter_only"
  decoding:
    temperature: 0.0
    top_p: 1.0
    max_tokens: 128
  runtime:
    sleep_s: 0.15
    save_every: 25
    limit: null
  outputs:
    parquet: "runs_ccsum/v4_dcq_{model_id}.parquet"
    log_jsonl: "logs_ccsum/v4_dcq_{model_id}.jsonl"
    summary_json: "outputs_ccsum/v4_dcq_summary_{model_id}.json"
    summary: "outputs_ccsum/v4_dcq_summary_{model_id}.json"

memorization:
  description: "Memorization probing via prefix completion against canonical reference."
  use_control_prefix: true
  decoding:
    temperature: 0.0
    top_p: 1.0
    max_tokens: 128
  runtime:
    sleep_s: 0.5
    save_every: 25
    limit: null
  outputs:
    parquet: "runs_ccsum/v5_mem_{model_id}.parquet"
    log_jsonl: "logs_ccsum/v5_mem_{model_id}.jsonl"
    summary_json: "outputs_ccsum/v5_mem_summary_{model_id}.json"
    summary: "outputs_ccsum/v5_mem_summary_{model_id}.json"

mem:
  outputs:
    summary: "outputs_ccsum/v5_mem_summary_{model_id}.json"

stability:
  description: "Stability detector via repeated stochastic one-sentence summarization."
  N_samples: 20
  use_control_baseline: false
  prompt:
    template: "news_article"
  decoding:
    temperature: 0.7
    top_p: 0.9
    max_tokens: 80
  greedy_anchor:
    temperature: 0.0
    top_p: 1.0
    max_tokens: 80
  metrics:
    distance: "token_level"
    max_pairs: 435
    anchor_eps: 0.15
    tokenization: "regex"
    tokenizer_name: null
  runtime:
    sleep_s: 0.10
    save_every: 10
    limit: null
    max_retries: 5
  outputs:
    parquet: "runs_ccsum/v6_stability_{model_id}.parquet"
    log_jsonl: "logs_ccsum/v6_stability_{model_id}.jsonl"
    summary_json: "outputs_ccsum/v6_stability_summary_{model_id}.json"
    summary: "outputs_ccsum/v6_stability_summary_{model_id}.json"
    control_parquet: "runs_ccsum/v6_stability_ctrl_{model_id}.parquet"

lexical:
  skip: true
  outputs:
    summary: "outputs_ccsum/v3_lexical_summary.json"
  min_span_len_strong: 100
  min_span_len_moderate: 50
  min_ngram_hits_moderate: 3

proxy_builder:
  enabled: true
  output_dir: "proxy_corpus_ccsum"
  github_structured_out: "proxy_corpus_ccsum/proxy_structured_github.csv"
  kaggle_structured_out: "proxy_corpus_ccsum/proxy_structured_kaggle.csv"
  merged_out: "proxy_corpus_ccsum/proxy_structured_merged.csv"
  proxy_out_txt: "proxy_corpus_ccsum/ccsum_proxy_summaries_norm_dedup.txt"
  manifest_out_jsonl: "proxy_corpus_ccsum/proxy_sources_manifest.jsonl"
  summary_out_json: "outputs_ccsum/proxy_build_summary.json"
  query_mode: "ids_and_keywords"
  id_query_cap: 30
  keywords:
    - "ccsum/ccsum_summary_only"
    - "CCSum summary only"
    - "CCSum NAACL 2024"
    - "ccsum summary"
    - "CCSUM"
  extraction:
    min_tokens: 12
    max_tokens: 140
    max_periods: 4
  github:
    enabled: false
    token_env: "GITHUB_TOKEN"
    per_query_max_results: 20
    max_pages: 2
    sleep_seconds: 2.0
    rate_limit_threshold: 20
    allowed_extensions: [".txt", ".jsonl", ".json", ".csv", ".tsv"]
    deny_repo_substrings: ["tutorial", "demo", "homework", "course", "leaderboard", "benchmark-results", "model-card"]
    max_file_bytes: 1000000
    path_deny_substrings: ["eval", "evaluation", "results", "outputs", "metrics"]
  kaggle:
    enabled: true
    max_datasets: 10
    dataset_keywords: ["ccsum", "ccsum summary only", "ccsum summaries", "ccsum_summary_only", "ccsum dataset"]
    file_allow_extensions: [".txt", ".jsonl", ".json", ".csv", ".tsv"]
    max_file_bytes: 1000000
    sleep_seconds: 3.0
    temp_dir: "proxy_corpus_ccsum/kaggle_tmp"

risk_integration:
  outputs:
    summary_json: "outputs_ccsum/v7_risk_summary_{model_id}.json"
    log_jsonl: "logs_ccsum/v7_risk_{model_id}.jsonl"
